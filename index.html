<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Calculator - Máy Tính Bỏ Túi Cao Cấp</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }
        .digital-font {
            font-family: 'Share Tech Mono', monospace;
        }
        /* Neumorphism shadows for Calculator Keys */
        .btn-calc {
            transition: all 0.15s ease-in-out;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .btn-calc:active {
            transform: translateY(2px);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }
        /* Custom scrollbar for history panel */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 2px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8">

    <div class="w-full max-w-4xl bg-slate-900/80 backdrop-blur-xl border border-slate-700/50 rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row">
        
        <!-- MAIN CALCULATOR SCREEN -->
        <div class="flex-1 p-6 md:p-8 flex flex-col justify-between">
            <!-- Header Bar -->
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500"></div>
                </div>
                <span class="text-xs font-semibold text-slate-400 tracking-widest uppercase">Pocket Calc - VM-01</span>
            </div>

            <!-- Digital Screen Panel -->
            <div class="bg-slate-950/90 border border-slate-800 rounded-2xl p-4 md:p-6 mb-6 flex flex-col items-end justify-between min-h-[140px] shadow-inner relative overflow-hidden">
                <!-- Decorative solar panel grid for authentic feel -->
                <div class="absolute top-2 left-4 flex space-x-1 opacity-20">
                    <div class="w-6 h-3 bg-amber-900 border border-amber-800 rounded-sm"></div>
                    <div class="w-6 h-3 bg-amber-900 border border-amber-800 rounded-sm"></div>
                    <div class="w-6 h-3 bg-amber-900 border border-amber-800 rounded-sm"></div>
                </div>
                
                <!-- Secondary/Expression Screen -->
                <div id="expression-display" class="digital-font text-slate-500 text-lg md:text-xl font-medium tracking-wide h-6 overflow-hidden w-full text-right select-all">
                    <!-- Expression state will render here -->
                </div>
                <!-- Primary Output Screen -->
                <div id="main-display" class="digital-font text-emerald-400 text-4xl md:text-5xl font-bold tracking-tight w-full text-right select-all break-all pr-1">
                    0
                </div>
            </div>

            <!-- Keyboard Layout -->
            <div class="grid grid-cols-4 gap-3 md:gap-4">
                <!-- Row 1: Operations and Actions -->
                <button data-type="clear" class="btn-calc bg-rose-950/40 text-rose-400 border border-rose-800/40 hover:bg-rose-900/50 py-4 rounded-xl font-bold text-lg">C</button>
                <button data-type="backspace" class="btn-calc bg-slate-800/80 text-slate-300 border border-slate-700/50 hover:bg-slate-700/60 py-4 rounded-xl font-bold text-lg"><i class="fa-solid fa-delete-left"></i></button>
                <button data-type="operator" data-val="/" class="btn-calc bg-indigo-950/40 text-indigo-400 border border-indigo-800/40 hover:bg-indigo-900/50 py-4 rounded-xl font-bold text-xl">/</button>
                <button data-type="operator" data-val="*" class="btn-calc bg-indigo-950/40 text-indigo-400 border border-indigo-800/40 hover:bg-indigo-900/50 py-4 rounded-xl font-bold text-xl">×</button>

                <!-- Row 2 -->
                <button data-type="number" data-val="7" class="btn-calc bg-slate-800/50 text-slate-100 border border-slate-700/30 hover:bg-slate-700/40 py-4 rounded-xl font-semibold text-xl">7</button>
                <button data-type="number" data-val="8" class="btn-calc bg-slate-800/50 text-slate-100 border border-slate-700/30 hover:bg-slate-700/40 py-4 rounded-xl font-semibold text-xl">8</button>
                <button data-type="number" data-val="9" class="btn-calc bg-slate-800/50 text-slate-100 border border-slate-700/30 hover:bg-slate-700/40 py-4 rounded-xl font-semibold text-xl">9</button>
                <button data-type="operator" data-val="-" class="btn-calc bg-indigo-950/40 text-indigo-400 border border-indigo-800/40 hover:bg-indigo-900/50 py-4 rounded-xl font-bold text-xl">−</button>

                <!-- Row 3 -->
                <button data-type="number" data-val="4" class="btn-calc bg-slate-800/50 text-slate-100 border border-slate-700/30 hover:bg-slate-700/40 py-4 rounded-xl font-semibold text-xl">4</button>
                <button data-type="number" data-val="5" class="btn-calc bg-slate-800/50 text-slate-100 border border-slate-700/30 hover:bg-slate-700/40 py-4 rounded-xl font-semibold text-xl">5</button>
                <button data-type="number" data-val="6" class="btn-calc bg-slate-800/50 text-slate-100 border border-slate-700/30 hover:bg-slate-700/40 py-4 rounded-xl font-semibold text-xl">6</button>
                <button data-type="operator" data-val="+" class="btn-calc bg-indigo-950/40 text-indigo-400 border border-indigo-800/40 hover:bg-indigo-900/50 py-4 rounded-xl font-bold text-xl">+</button>

                <!-- Row 4 & 5 Combined -->
                <div class="col-span-3 grid grid-cols-3 gap-3 md:gap-4">
                    <button data-type="number" data-val="1" class="btn-calc bg-slate-800/50 text-slate-100 border border-slate-700/30 hover:bg-slate-700/40 py-4 rounded-xl font-semibold text-xl">1</button>
                    <button data-type="number" data-val="2" class="btn-calc bg-slate-800/50 text-slate-100 border border-slate-700/30 hover:bg-slate-700/40 py-4 rounded-xl font-semibold text-xl">2</button>
                    <button data-type="number" data-val="3" class="btn-calc bg-slate-800/50 text-slate-100 border border-slate-700/30 hover:bg-slate-700/40 py-4 rounded-xl font-semibold text-xl">3</button>
                    
                    <button data-type="number" data-val="0" class="col-span-2 btn-calc bg-slate-800/50 text-slate-100 border border-slate-700/30 hover:bg-slate-700/40 py-4 rounded-xl font-semibold text-xl">0</button>
                    <button data-type="decimal" class="btn-calc bg-slate-800/50 text-slate-100 border border-slate-700/30 hover:bg-slate-700/40 py-4 rounded-xl font-bold text-xl">.</button>
                </div>

                <!-- Big Equals Button -->
                <button data-type="equals" class="btn-calc bg-emerald-600 text-white hover:bg-emerald-500 py-4 rounded-xl font-bold text-2xl shadow-emerald-900/50 border border-emerald-500/30 flex items-center justify-center">
                    =
                </button>
            </div>
        </div>

        <!-- SIDEBAR: CALCULATION HISTORY -->
        <div class="w-full md:w-80 bg-slate-950/40 border-t md:border-t-0 md:border-l border-slate-800 p-6 flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-slate-200 font-semibold tracking-wide flex items-center gap-2">
                        <i class="fa-solid fa-history text-indigo-400"></i> Lịch Sử Phép Tính
                    </h3>
                    <button id="clear-history-btn" class="text-xs text-slate-400 hover:text-rose-400 transition-colors flex items-center gap-1 font-medium">
                        <i class="fa-solid fa-trash-can"></i> Xóa
                    </button>
                </div>
                <!-- History Items container -->
                <div id="history-container" class="space-y-3 max-h-[220px] md:max-h-[360px] overflow-y-auto custom-scroll pr-1">
                    <!-- History rows will render dynamically here -->
                    <div id="history-empty-state" class="text-center py-8 text-slate-500 text-sm italic">
                        Chưa có lịch sử tính toán nào
                    </div>
                </div>
            </div>

            <!-- Footer Help/Keyboard Shortcuts Guide -->
            <div class="mt-4 pt-4 border-t border-slate-800/60 hidden md:block">
                <span class="text-xs text-slate-500 block mb-1 font-semibold uppercase">Mẹo phím tắt:</span>
                <div class="grid grid-cols-2 gap-1 text-[11px] text-slate-400">
                    <div><kbd class="bg-slate-800 px-1 py-0.5 rounded text-slate-300">Enter</kbd> : Bằng (=)</div>
                    <div><kbd class="bg-slate-800 px-1 py-0.5 rounded text-slate-300">Esc</kbd> / <kbd class="bg-slate-800 px-1 py-0.5 rounded text-slate-300">Delete</kbd> : Xóa (C)</div>
                    <div><kbd class="bg-slate-800 px-1 py-0.5 rounded text-slate-300">BackSpace</kbd> : Xóa chữ số</div>
                    <div><kbd class="bg-slate-800 px-1 py-0.5 rounded text-slate-300">+</kbd> <kbd class="bg-slate-800 px-1 py-0.5 rounded text-slate-300">-</kbd> <kbd class="bg-slate-800 px-1 py-0.5 rounded text-slate-300">*</kbd> <kbd class="bg-slate-800 px-1 py-0.5 rounded text-slate-300">/</kbd></div>
                </div>
            </div>
        </div>

    </div>

    <!-- CORE CALCULATOR APP SCRIPT -->
    <script>
        class PocketCalculator {
            constructor() {
                this.mainDisplay = document.getElementById('main-display');
                this.expressionDisplay = document.getElementById('expression-display');
                this.historyContainer = document.getElementById('history-container');
                this.emptyState = document.getElementById('history-empty-state');
                
                // State Machine Variables
                this.currentOperand = '';
                this.previousOperand = '';
                this.operation = undefined;
                this.hasError = false;
                this.isCalculationDone = false;
                
                this.history = JSON.parse(localStorage.getItem('calc_history')) || [];
                
                this.initEventListeners();
                this.updateDisplay();
                this.renderHistory();
            }

            initEventListeners() {
                // Button click event dispatching
                document.querySelectorAll('.btn-calc').forEach(button => {
                    button.addEventListener('click', () => {
                        const type = button.dataset.type;
                        const val = button.dataset.val;
                        this.handleInput(type, val);
                    });
                });

                // Clear history button click
                document.getElementById('clear-history-btn').addEventListener('click', () => {
                    this.clearHistory();
                });

                // Physical Keyboard Bindings
                document.addEventListener('keydown', (e) => {
                    let key = e.key;
                    if (key >= '0' && key <= '9') {
                        this.handleInput('number', key);
                    } else if (key === '.') {
                        this.handleInput('decimal');
                    } else if (key === '+' || key === '-' || key === '*' || key === '/') {
                        this.handleInput('operator', key);
                    } else if (key === 'Enter' || key === '=') {
                        e.preventDefault();
                        this.handleInput('equals');
                    } else if (key === 'Backspace') {
                        this.handleInput('backspace');
                    } else if (key === 'Escape' || key === 'Delete') {
                        this.handleInput('clear');
                    }
                });
            }

            handleInput(type, value) {
                if (this.hasError && type !== 'clear') return; // Lock the calculator except for the clear button

                switch(type) {
                    case 'number':
                        this.appendNumber(value);
                        break;
                    case 'decimal':
                        this.appendDecimal();
                        break;
                    case 'operator':
                        this.chooseOperation(value);
                        break;
                    case 'clear':
                        this.clear();
                        break;
                    case 'backspace':
                        this.backspace();
                        break;
                    case 'equals':
                        this.compute();
                        break;
                }
                this.updateDisplay();
            }

            appendNumber(num) {
                if (this.isCalculationDone) {
                    this.currentOperand = num;
                    this.isCalculationDone = false;
                } else {
                    if (this.currentOperand === '0') {
                        this.currentOperand = num;
                    } else {
                        this.currentOperand = this.currentOperand.toString() + num;
                    }
                }
            }

            appendDecimal() {
                if (this.isCalculationDone) {
                    this.currentOperand = '0.';
                    this.isCalculationDone = false;
                    return;
                }
                if (this.currentOperand.includes('.')) return; // Prevent multiple decimals
                if (this.currentOperand === '') {
                    this.currentOperand = '0.';
                } else {
                    this.currentOperand += '.';
                }
            }

            chooseOperation(op) {
                if (this.currentOperand === '' && this.previousOperand === '') return;
                
                if (this.previousOperand !== '') {
                    this.compute(true); // Intermediate compute chain without flagging finished calculation
                }
                
                this.operation = op;
                if (this.currentOperand !== '') {
                    this.previousOperand = this.currentOperand;
                    this.currentOperand = '';
                }
            }

            clear() {
                this.currentOperand = '';
                this.previousOperand = '';
                this.operation = undefined;
                this.hasError = false;
                this.isCalculationDone = false;
            }

            backspace() {
                if (this.isCalculationDone) return;
                this.currentOperand = this.currentOperand.toString().slice(0, -1);
            }

            // Safe mathematical computations overcoming standard floating-point precision flaws
            safeCompute(num1, num2, op) {
                const n1 = parseFloat(num1);
                const n2 = parseFloat(num2);
                if (isNaN(n1) || isNaN(n2)) return '';

                // Calculate standard decimal scales to perform integer operations
                const s1 = (num1.split('.')[1] || '').length;
                const s2 = (num2.split('.')[1] || '').length;
                const baseMultiplier = Math.pow(10, Math.max(s1, s2));

                let rawResult;
                switch(op) {
                    case '+':
                        rawResult = (n1 * baseMultiplier + n2 * baseMultiplier) / baseMultiplier;
                        break;
                    case '-':
                        rawResult = (n1 * baseMultiplier - n2 * baseMultiplier) / baseMultiplier;
                        break;
                    case '*':
                        rawResult = (n1 * baseMultiplier * (n2 * baseMultiplier)) / (baseMultiplier * baseMultiplier);
                        break;
                    case '/':
                        if (n2 === 0) {
                            this.hasError = true;
                            return 'Error: Division by zero';
                        }
                        rawResult = n1 / n2;
                        break;
                    default:
                        return '';
                }

                // Smooth round to a maximum of 8 floating decimals
                return parseFloat(rawResult.toFixed(8)).toString();
            }

            compute(isIntermediate = false) {
                if (this.previousOperand === '' || this.currentOperand === '') return;

                const rawVal = this.safeCompute(this.previousOperand, this.currentOperand, this.operation);
                
                if (this.hasError) {
                    this.currentOperand = rawVal; // Holds Error message
                    return;
                }

                // Add complete action to system history log
                if (!isIntermediate) {
                    const mathExpr = `${this.previousOperand} ${this.getOpSymbol(this.operation)} ${this.currentOperand}`;
                    this.addToHistory(mathExpr, rawVal);
                }

                this.currentOperand = rawVal;
                this.previousOperand = '';
                this.operation = undefined;
                this.isCalculationDone = !isIntermediate;
            }

            getOpSymbol(op) {
                if (op === '*') return '×';
                if (op === '/') return '÷';
                return op;
            }

            updateDisplay() {
                if (this.hasError) {
                    this.mainDisplay.innerText = this.currentOperand;
                    this.expressionDisplay.innerText = '';
                    this.mainDisplay.classList.remove('text-emerald-400');
                    this.mainDisplay.classList.add('text-rose-400');
                    return;
                }

                this.mainDisplay.classList.add('text-emerald-400');
                this.mainDisplay.classList.remove('text-rose-400');

                // Render main display screen
                if (this.currentOperand === '') {
                    this.mainDisplay.innerText = '0';
                } else {
                    this.mainDisplay.innerText = this.currentOperand;
                }

                // Render upper secondary expression display
                if (this.operation != null) {
                    this.expressionDisplay.innerText = `${this.previousOperand} ${this.getOpSymbol(this.operation)}`;
                } else {
                    this.expressionDisplay.innerText = '';
                }
            }

            addToHistory(expression, result) {
                const record = {
                    id: Date.now(),
                    expression: expression,
                    result: result
                };
                this.history.unshift(record); // push on top
                // Cap history list size to 25 items
                if (this.history.length > 25) {
                    this.history.pop();
                }
                localStorage.setItem('calc_history', JSON.stringify(this.history));
                this.renderHistory();
            }

            renderHistory() {
                // Clear existing render items besides template holder
                const itemNodes = this.historyContainer.querySelectorAll('.history-item');
                itemNodes.forEach(node => node.remove());

                if (this.history.length === 0) {
                    this.emptyState.classList.remove('hidden');
                    return;
                }
                this.emptyState.classList.add('hidden');

                this.history.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'history-item bg-slate-900/60 hover:bg-slate-800/60 border border-slate-800/80 rounded-xl p-3 cursor-pointer transition-all duration-150 flex flex-col items-end group';
                    row.innerHTML = `
                        <div class="text-xs text-slate-500 digital-font font-semibold group-hover:text-slate-400 transition-colors">${item.expression} =</div>
                        <div class="text-base text-indigo-300 font-bold digital-font group-hover:text-emerald-400 transition-colors mt-0.5">${item.result}</div>
                    `;
                    row.addEventListener('click', () => {
                        this.loadHistoryItem(item);
                    });
                    this.historyContainer.appendChild(row);
                });
            }

            loadHistoryItem(item) {
                if (this.hasError) return;
                this.currentOperand = item.result;
                this.previousOperand = '';
                this.operation = undefined;
                this.isCalculationDone = true;
                this.updateDisplay();
            }

            clearHistory() {
                this.history = [];
                localStorage.removeItem('calc_history');
                this.renderHistory();
            }
        }

        // Initialize application instance on DOM load
        document.addEventListener('DOMContentLoaded', () => {
            window.pocketCalcInstance = new PocketCalculator();
        });
    </script>
</body>
</html>
